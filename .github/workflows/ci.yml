name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  release:
    types: [published]

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Test (server + client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root deps
        run: npm ci

      - name: Server: install & tests
        working-directory: ./server
        run: |
          npm ci
          npm test

      - name: Client: install & build
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Upload test results (placeholder)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-result
          path: |
            server/jest-results || true
            client/jest-results || true

  build_windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: npm ci

      - name: Build client
        working-directory: ./client
        run: npm ci && npm run build

      - name: Build server
        working-directory: ./server
        run: npm ci && npm run build

      - name: Package Electron (Windows NSIS)
        working-directory: ./desktop
        env:
          CSC_LINK: ${{ secrets.WINDOWS_SIGNING_P12 }} # base64-encoded P12 (recommended)
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npm ci
          npx electron-builder --win nsis -c.extraMetadata.main=main.js -p never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gaia-windows-artifacts
          path: desktop/dist || desktop/build || build || build/artifacts || build/release || dist || "build/artifacts/**"

  publish:
    name: Publish Release (on tag)
    runs-on: ubuntu-latest
    needs: [build_windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Publish via electron-builder
        working-directory: ./desktop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_SIGNING_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          npm ci
          npx electron-builder --publish always

# NOTE:
# - Provide secrets in repository settings:
#   * GH_TOKEN (with repo:packages or repo scope for creating releases)
#   * WINDOWS_SIGNING_P12 (base64 of .p12/.pfx)
#   * WINDOWS_SIGNING_PASSWORD (password for the P12)
# - For macOS signing notarization add APPLE_ID, APPLE_PASSWORD and relevant certs
# - For private tests you can add META_APP_ID and META_APP_SECRET to the repository secrets
