server {
    listen 80;
    server_name _;

    # Serve static assets
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to backend service inside Docker network
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
    }

    # SPA fallback for client-side routes (serve index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: small gzip and caching for static assets
    gzip on;
    gzip_types text/plain application/javascript application/json text/css application/xml;
    sendfile on;
}
